name: Expo SDK 58 validation
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Expo dependencies
        run: npx expo install --check
      - name: Expo Doctor health check
        run: npx expo-doctor@latest
      - name: Runtime syntax checks
        run: node --check runtime/workspaces.mjs && node --check runtime/server.mjs
      - name: TypeScript check
        run: npm run typecheck
      - name: Verify iOS JavaScript bundle compiles
        run: npx expo export --platform ios --output-dir /tmp/noethara-ios-smoke-test --clear
