name: Expo SDK 58 validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Expo dependencies
        run: npx expo install --check
      - name: Expo Doctor health check
        run: npx expo-doctor@latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Supabase Edge function type check
        run: deno check supabase/functions/noethara-api/index.ts
      - name: Install isolated gateway dependencies
        run: npm install --prefix runtime --no-audit --no-fund
      - name: Managed workspace API tests
        run: node --test runtime/workspaces.test.mjs runtime/agent.test.mjs runtime/pages-preview.test.mjs
      - name: Runtime syntax checks
        run: node --check runtime/workspaces.mjs && node --check runtime/server.mjs && node --check runtime/agent.mjs && node --check runtime/preview.mjs
      - name: TypeScript check
        run: npm run typecheck
      - name: Verify iOS JavaScript bundle compiles
        run: npx expo export --platform ios --output-dir /tmp/noethara-ios-smoke-test --clear
