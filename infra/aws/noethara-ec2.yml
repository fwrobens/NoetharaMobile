AWSTemplateFormatVersion: '2010-09-09'
Description: 'NoetharaMobile owner-controlled Ubuntu 22.04 EC2 workspace; no credentials embedded'
Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: 'Existing EC2 SSH key pair created and saved safely by the account owner'
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: 'Public subnet with a route to an Internet Gateway'
  AdminCidr:
    Type: String
    Description: 'Administrator public IP CIDR e.g. 203.0.113.10/32. Never use 0.0.0.0/0 here.'
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}\/([0-9]|[12][0-9]|3[0-2])
  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: '/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id'
Resources:
  NoetharaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Noethara EC2 web proxy and admin-restricted SSH/API'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
          Description: SSH-admin-only
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP-for-reverse-proxy
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS-after-certificate-is-configured
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref AdminCidr
          Description: Admin-restricted-api-debugging-only
      Tags:
        - Key: Project
          Value: NoetharaMobile
  NoetharaInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.large
      KeyName: !Ref KeyPairName
      ImageId: !Ref LatestUbuntuAmi
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref NoetharaSecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 50
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl gnupg python3 python3-pip python3-venv git nginx tmux jq openssl awscli
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu jammy stable" > /etc/apt/sources.list.d/docker.list
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin nodejs
          npm install -g pm2
          systemctl enable --now docker nginx
          usermod -aG docker ubuntu
          mkdir -p /opt/noethara /var/log/noethara
          chown -R ubuntu:ubuntu /opt/noethara /var/log/noethara
          mkdir -p /etc/noethara
          chmod 700 /etc/noethara
          # Placeholder health API. The separate CLI bridge starts only after
          # the authorized repository has been cloned and a runtime token set.
          cat > /opt/noethara/health.mjs <<'NODE'
          import { createServer } from 'node:http';
          createServer((req,res)=>{
            res.writeHead(req.url==='/health'?200:503,{
              'content-type':'application/json','cache-control':'no-store'
            });
            res.end(JSON.stringify({
              name:'NoetharaMobile',healthy:true,apiReady:false,
              details:'Install the private repo and start the authenticated runtime.'
            }));
          }).listen(3000,'127.0.0.1');
          NODE
          cd /opt/noethara
          sudo -u ubuntu pm2 start /opt/noethara/health.mjs --name noethara-health
          sudo -u ubuntu pm2 save
          env PATH=/usr/bin:$PATH pm2 startup systemd -u ubuntu --hp /home/ubuntu
          cat > /etc/nginx/sites-available/noethara <<'NGINX'
          server {
            listen 80 default_server;
            server_name _;
            client_max_body_size 1m;
            location /health {
              proxy_pass http://127.0.0.1:3000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
            }
            location / {
              return 503 "Noethara runtime not yet configured";
            }
            # Do not expose the terminal publicly before configuring TLS
            # and private network access.
          }
          NGINX
          rm -f /etc/nginx/sites-enabled/default
          ln -s /etc/nginx/sites-available/noethara /etc/nginx/sites-enabled/noethara
          nginx -t
          systemctl restart nginx
      Tags:
        - Key: Name
          Value: NoetharaMobile-ubuntu2204
        - Key: Project
          Value: NoetharaMobile
  NoetharaAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: NoetharaMobile-EIP
  NoetharaEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt NoetharaAddress.AllocationId
      InstanceId: !Ref NoetharaInstance
Outputs:
  InstanceId:
    Value: !Ref NoetharaInstance
  PublicIp:
    Value: !Ref NoetharaAddress
  SecurityGroupId:
    Value: !Ref NoetharaSecurityGroup
  SSHCommand:
    Value: !Sub 'ssh -i /path/to/private-key.pem ubuntu@${NoetharaAddress}'
  HealthUrl:
    Value: !Sub 'http://${NoetharaAddress}/health'

  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: '/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id'
